{% extends 'base.html' %}
{% block title %}Delete User{% endblock %}

{% block content %}
<div class="confirm-box">
  <h2>Delete User</h2>
  <p>Are you sure you want to delete <strong>{{ target_user.username }}</strong>? This cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'user_list' %}" class="btn-outline">Cancel</a>
  </form>
</div>
{% endblock %}
