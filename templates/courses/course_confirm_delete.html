{% extends 'base.html' %}
{% block title %}Delete Course{% endblock %}

{% block content %}
<div class="confirm-box">
  <h2>Delete Course</h2>
  <p>Are you sure you want to delete <strong>{{ course.title }}</strong>?
     This will also delete all assignments and submissions.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'course_detail' course.pk %}" class="btn-outline">Cancel</a>
  </form>
</div>
{% endblock %}
