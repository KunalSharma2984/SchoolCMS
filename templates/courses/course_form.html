{% extends 'base.html' %}
{% block title %}{{ action }} Course{% endblock %}

{% block content %}
<h2>{{ action }} Course</h2>
<form method="post" class="form-box">
  {% csrf_token %}
  {% for field in form %}
    <div class="field-group">
      <label>{{ field.label }}</label>
      {{ field }}
      {% if field.errors %}<span class="field-error">{{ field.errors.0 }}</span>{% endif %}
    </div>
  {% endfor %}
  <div class="form-actions">
    <button type="submit" class="btn">{{ action }} Course</button>
    <a href="{% url 'course_list' %}" class="btn-outline">Cancel</a>
  </div>
</form>
{% endblock %}
