{% extends 'base.html' %}
{% block title %}New Assignment{% endblock %}

{% block content %}
<h2>New Assignment for <em>{{ course.title }}</em></h2>
<form method="post" class="form-box">
  {% csrf_token %}
  {% for field in form %}
    <div class="field-group">
      <label>{{ field.label }}</label>
      {{ field }}
      {% if field.errors %}<span class="field-error">{{ field.errors.0 }}</span>{% endif %}
    </div>
  {% endfor %}
  <div class="form-actions">
    <button type="submit" class="btn">Create Assignment</button>
    <a href="{% url 'course_detail' course.pk %}" class="btn-outline">Cancel</a>
  </div>
</form>
{% endblock %}
