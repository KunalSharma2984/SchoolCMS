{% extends 'base.html' %}
{% block title %}Delete Assignment{% endblock %}

{% block content %}
<div class="confirm-box">
  <h2>Delete Assignment</h2>
  <p>Are you sure you want to delete <strong>{{ assignment.title }}</strong>?
     All submissions will also be deleted.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'course_detail' assignment.course.pk %}" class="btn-outline">Cancel</a>
  </form>
</div>
{% endblock %}
